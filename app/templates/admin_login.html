{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block head_extra %}
<style>
  .login-wrap{
    max-width:520px;
    margin:28px auto 0;
  }

  .login-card{
    padding:24px;
  }

  .login-card label{
    display:block;
    font-size:12px;
    color:var(--muted2);
    margin:12px 0 6px;
    font-weight:700;
  }

  .login-card input{
    width:100%;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#fff;
    font-size:14px;
    outline:none;
  }

  .login-card input:focus{
    border-color:#b9d0f7;
    box-shadow:0 0 0 4px rgba(44,107,237,.08);
  }

  .error-box{
    border:1px solid rgba(225,75,75,.22);
    background:rgba(225,75,75,.08);
    color:#9b1c1c;
    padding:12px 14px;
    border-radius:14px;
    margin:12px 0;
    font-size:14px;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1 style="margin-bottom:6px">Admin Login</h1>
    <div class="sub">สำหรับเจ้าหน้าที่เท่านั้น</div>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <label>รหัสผ่าน</label>
      <input type="password" name="password" required placeholder="ใส่รหัสผ่านแอดมิน">

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" type="submit" style="flex:1;min-width:180px;">เข้าสู่ระบบ</button>
        <a class="btn" href="/home" style="flex:1;min-width:180px;">กลับหน้า Home</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
